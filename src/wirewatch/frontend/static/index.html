<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Wirewatch</title>
</head>
<body>
	<h1>Wirewatch</h1>
	<p>Placeholder page: shows the raw /api/state JSON.</p>
	<pre id="state">waiting for /api/state</pre>

	<script>
		// Placeholder until Juan's page replaces it. Asks the server for new data once a second.
		async function refresh() {
			const response = await fetch("/api/state");
			document.getElementById("state").textContent = JSON.stringify(await response.json(), null, 2);
		}
		refresh();
		setInterval(refresh, 1000);
	</script>
</body>
</html>
